name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor deps
        run: npm install

      - name: Inject build version
        run: |
          cat > www/build-version.js << EOF
          window.BUILD_VERSION = 'v0.${{ github.run_number }}';
          window.BUILD_NUMBER = ${{ github.run_number }};
          window.BUILD_TIME = '$(date -u +%Y-%m-%dT%H:%M:%SZ)';
          EOF
          echo "Injected:"
          cat www/build-version.js

      - name: Add Android platform
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Bump Android SDK versions for Capgo plugin
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i -E 's/(compileSdkVersion[[:space:]]*=[[:space:]]*)34/\135/g' android/variables.gradle
            sed -i -E 's/(targetSdkVersion[[:space:]]*=[[:space:]]*)34/\135/g' android/variables.gradle
            sed -i -E 's/(minSdkVersion[[:space:]]*=[[:space:]]*)22/\123/g' android/variables.gradle
            echo "After bump:"
            cat android/variables.gradle
          fi

      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          printf '%s' "$KEYSTORE" | base64 -d > android/app/release.keystore
          ls -la android/app/release.keystore
          file android/app/release.keystore

      - name: Configure signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cat >> android/app/build.gradle <<EOF

          android {
            signingConfigs {
              release {
                storeFile file('release.keystore')
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias 'android'
                keyPassword System.getenv("KEYSTORE_PASSWORD")
                storeType 'JKS'
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
                minifyEnabled false
              }
            }
          }
          EOF

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: cd android && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/game-of-life.apk

      - name: Build www bundle (hot-update payload)
        run: |
          cd www
          zip -r ../out/bundle.zip .
          cd ..
          echo "Bundle size: $(du -sh out/bundle.zip | cut -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-of-life-apk
          path: out/game-of-life.apk

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            out/game-of-life.apk
            out/bundle.zip
          generate_release_notes: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
