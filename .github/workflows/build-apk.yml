name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor deps
        run: npm install

      - name: Inject build version
        run: |
          cat > www/build-version.js << EOF
          window.BUILD_VERSION = 'v0.${{ github.run_number }}';
          window.BUILD_NUMBER = ${{ github.run_number }};
          window.BUILD_TIME = '$(date -u +%Y-%m-%dT%H:%M:%SZ)';
          EOF
          echo "Injected:"
          cat www/build-version.js

      - name: Add Android platform
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          printf '%s' "$KEYSTORE" | base64 -d > android/app/release.keystore
          ls -la android/app/release.keystore
          file android/app/release.keystore

      - name: Configure signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cat >> android/app/build.gradle <<EOF

          android {
            signingConfigs {
              release {
                storeFile file('release.keystore')
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias 'android'
                keyPassword System.getenv("KEYSTORE_PASSWORD")
                storeType 'JKS'
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
                minifyEnabled false
              }
            }
          }
          EOF

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: cd android && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename AP